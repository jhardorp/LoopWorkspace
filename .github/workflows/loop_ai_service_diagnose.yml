name: Check Loop AI service
on:
  push:
    branches: ['migration/loop4-ai-photo']
    paths:
      - '.github/workflows/loop_ai_service_diagnose.yml'
      - 'Prototypes/AIFoodRecognition/Integration/NextUpdate/diagnose_service.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loop-ai-service-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    if: >-
      github.repository == 'jhardorp/LoopWorkspace' &&
      github.ref == 'refs/heads/migration/loop4-ai-photo' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[ai-service-check]'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify protected app and backend configuration
        run: python3 Prototypes/AIFoodRecognition/Integration/verify_migration.py
      - name: Check diagnostic syntax
        run: node --check Prototypes/AIFoodRecognition/Integration/NextUpdate/diagnose_service.mjs
      - name: Check existing service and one synthetic meal without deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FOOD_OPENAI_API_KEY: ${{ secrets.FOOD_OPENAI_API_KEY }}
          FOOD_TESTER_ACCESS_CODE: ${{ secrets.FOOD_TESTER_ACCESS_CODE }}
        run: node Prototypes/AIFoodRecognition/Integration/NextUpdate/diagnose_service.mjs
      - name: Retain sanitized diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-ai-service-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/AIServiceDiagnostic.json
          if-no-files-found: warn
          retention-days: 7
