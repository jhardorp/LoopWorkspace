name: Experimental Loop AI migration validation
on:
  push:
    branches: ['migration/loop4-ai-photo']
  workflow_dispatch:
    inputs:
      prepare_signed_candidate:
        type: boolean
        description: Archive a candidate for a spare test device using existing signing; never upload or install
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: loop-ai-migration-validation
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/migration/loop4-ai-photo'
    runs-on: macos-26-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Select pinned Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Verify pinned sources and protected production configuration
        run: python3 Prototypes/AIFoodRecognition/Integration/verify_migration.py
      - name: Start disposable Simulator first boot before compilation
        run: >-
          python3 Prototypes/AIFoodRecognition/Integration/probe_simulator_startup.py
          --prepare-only --output "$RUNNER_TEMP/LoopMigrationStartup"
      - name: Run Swift review regression tests
        run: swift test --package-path Prototypes/AIFoodRecognition
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test unchanged backend contract without deploying
        working-directory: Prototypes/AIFoodRecognition/Backend
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
      - name: Install pinned project tools
        run: bundle install
      - name: Check validation and candidate tooling syntax
        run: |
          python3 -m py_compile Prototypes/AIFoodRecognition/Integration/probe_simulator_startup.py
          ruby -c Prototypes/AIFoodRecognition/Integration/experimental_archive/fastlane/Fastfile
      - name: Port and link the reviewed-input UI
        run: |
          python3 Prototypes/AIFoodRecognition/Integration/apply.py
          bundle exec ruby Prototypes/AIFoodRecognition/Integration/configure_project.rb
          python3 Prototypes/AIFoodRecognition/Integration/configure_scheme.py
      - name: Build integrated app for iOS Simulator unsigned
        run: |
          set -o pipefail
          xcodebuild -workspace LoopWorkspace.xcworkspace -scheme LoopWorkspace \
            -destination 'generic/platform=iOS Simulator' -onlyUsePackageVersionsFromResolvedFile \
            -derivedDataPath "$RUNNER_TEMP/LoopMigration" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            > "$RUNNER_TEMP/LoopMigrationBuild.log" 2>&1 || {
              tail -n 180 "$RUNNER_TEMP/LoopMigrationBuild.log"
              exit 1
            }
          tail -n 12 "$RUNNER_TEMP/LoopMigrationBuild.log"
      - name: Probe normal application startup in a disposable Simulator
        id: startup
        run: |
          python3 Prototypes/AIFoodRecognition/Integration/probe_simulator_startup.py \
            --app "$RUNNER_TEMP/LoopMigration/Build/Products/Debug-iphonesimulator/Loop.app" \
            --output "$RUNNER_TEMP/LoopMigrationStartup" \
            > "$RUNNER_TEMP/LoopMigrationStartup.log" 2>&1 || {
              cat "$RUNNER_TEMP/LoopMigrationStartup.log"
              exit 1
            }
          cat "$RUNNER_TEMP/LoopMigrationStartup.log"
      - name: Prepare isolated unsigned native adapter test host
        id: test_host
        if: ${{ !cancelled() && (success() || steps.startup.outcome == 'failure') }}
        run: bundle exec ruby Prototypes/AIFoodRecognition/Integration/prepare_test_host.rb
      - name: Run native adapter regression tests on Simulator
        if: ${{ !cancelled() && steps.test_host.outcome == 'success' }}
        run: |
          set -o pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
          xcodebuild -workspace LoopWorkspace.xcworkspace -scheme LoopWorkspace \
            -destination "platform=iOS Simulator,id=$device" -onlyUsePackageVersionsFromResolvedFile \
            -derivedDataPath "$RUNNER_TEMP/LoopMigration" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            > "$RUNNER_TEMP/LoopMigrationTestHost.log" 2>&1 || {
              tail -n 180 "$RUNNER_TEMP/LoopMigrationTestHost.log"
              exit 1
            }
          xcodebuild -workspace LoopWorkspace.xcworkspace -scheme LoopTests \
            -destination "platform=iOS Simulator,id=$device" -onlyUsePackageVersionsFromResolvedFile \
            -derivedDataPath "$RUNNER_TEMP/LoopMigration" \
            -resultBundlePath "$RUNNER_TEMP/MealPhotoMigration.xcresult" \
            -only-testing:LoopTests/MealPhotoMigrationTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test \
            > "$RUNNER_TEMP/LoopMigrationTests.log" 2>&1 || {
              tail -n 180 "$RUNNER_TEMP/LoopMigrationTests.log"
              exit 1
            }
          tail -n 30 "$RUNNER_TEMP/LoopMigrationTests.log"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = (Path(os.environ['RUNNER_TEMP']) / 'LoopMigrationTests.log').read_text()
          passed = set(re.findall(r"MealPhotoMigrationTests (test\w+)\]' passed", log))
          if len(passed) != 6:
              raise SystemExit(f'Expected six native adapter cases; found {len(passed)}. Refusing an empty test run.')
          PY
      - name: Retain validation logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-loop-ai-validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/LoopMigrationBuild.log
            ${{ runner.temp }}/LoopMigrationTests.log
            ${{ runner.temp }}/LoopMigrationTestHost.log
            ${{ runner.temp }}/LoopMigrationStartup.log
            ${{ runner.temp }}/LoopMigrationStartup
            ${{ runner.temp }}/MealPhotoMigration.xcresult
          retention-days: 14
      - name: Require normal startup as well as adapter tests
        if: always()
        env:
          STARTUP_OUTCOME: ${{ steps.startup.outcome }}
        run: |
          test "$STARTUP_OUTCOME" = success
      - name: Clean up the disposable startup Simulator
        if: always()
        run: >-
          python3 Prototypes/AIFoodRecognition/Integration/probe_simulator_startup.py
          --cleanup-only --output "$RUNNER_TEMP/LoopMigrationStartup"
  archive_candidate:
    name: Archive candidate for a spare test device only
    if: >-
      github.ref == 'refs/heads/migration/loop4-ai-photo' &&
      ((github.event_name == 'workflow_dispatch' && inputs.prepare_signed_candidate) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[archive-candidate]')))
    needs: validate
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Select the validated Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Verify protected configuration and source pins
        run: python3 Prototypes/AIFoodRecognition/Integration/verify_migration.py
      - name: Install pinned project tools
        run: bundle install
      - name: Apply the native adapter to the normal app
        run: |
          python3 Prototypes/AIFoodRecognition/Integration/apply.py
          bundle exec ruby Prototypes/AIFoodRecognition/Integration/configure_project.rb
          python3 Prototypes/AIFoodRecognition/Integration/configure_scheme.py
      - name: Preconfigure the existing personal tester login
        env:
          FOOD_TESTER_ACCESS_CODE: ${{ secrets.FOOD_TESTER_ACCESS_CODE }}
        run: >-
          python3 Prototypes/AIFoodRecognition/Distribution/configure_meal_review.py
          --plist Loop/Loop/Info.plist
      - name: Archive without changing provisioning or publishing
        working-directory: Prototypes/AIFoodRecognition/Integration/experimental_archive
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: 'true'
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_HIDE_CHANGELOG: 'true'
          MIGRATION_CANDIDATE_SHA: ${{ github.sha }}
        run: bundle exec fastlane ios archive_candidate
      - name: Record candidate provenance
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, plistlib, subprocess, zipfile
          from pathlib import Path
          ipa = Path('Loop.ipa')
          with zipfile.ZipFile(ipa) as archive:
              info = plistlib.loads(archive.read('Payload/Loop.app/Info.plist'))
          record = {
              'source': os.environ['CANDIDATE_SHA'],
              'ipa_sha256': hashlib.file_digest(ipa.open('rb'), 'sha256').hexdigest(),
              'bundle': info['CFBundleIdentifier'],
              'version': info['CFBundleShortVersionString'],
              'build': info['CFBundleVersion'],
              'app_group': info['AppGroupIdentifier'],
              'minimum_ios': info['MinimumOSVersion'],
              'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
              'restriction': 'Experimental. Existing production app identity: spare test device only. Not uploaded or approved for therapy.'
          }
          Path('MigrationCandidate.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Retain the experimental archive for review
        uses: actions/upload-artifact@v4
        with:
          name: experimental-loop-candidate-${{ github.sha }}
          path: |
            Loop.ipa
            MigrationCandidate.json
          if-no-files-found: error
          retention-days: 7
